[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "farzam-object-detector"
version = "1.1.0"
description = "YOLO11 image, video and webcam detection with an independent ONNX Runtime backend"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = "AGPL-3.0-only"
authors = [{name = "Farzam Fattahi"}]
dependencies = [
  "numpy>=1.26,<3", "opencv-python>=4.10,<5", "Pillow>=10,<13",
  "ultralytics==8.3.203", "torch>=2.2,<3", "torchvision>=0.17,<1",
  "onnxruntime>=1.20,<2", "onnx>=1.17,<1.20", "streamlit>=1.45,<2",
  "imageio-ffmpeg>=0.6,<1",
  "PyYAML>=6,<7", "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1", "build>=1,<2"]

[project.scripts]
cv-detect = "object_detector.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
